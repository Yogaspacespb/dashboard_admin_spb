<title>Yoga Space — База знаний администратора</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500&family=Montserrat:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    /* Brand colours sampled from yogaspace.ru */
    --olive:#5C6937; --olive-dark:#3C481A; --cream:#FDF6F0; --orange:#F0803B; --peach:#FF8562; --coral:#F95D51;
    /* Light tokens */
    --bg:#FDF6F0; --surface:#FFFFFF; --surface-2:#F5EEE4;
    --ink:#242424; --ink-soft:#5C6937; --muted:#655A50; --muted-2:#A8A092; --taupe:#655A50;
    --line:#E0D6CE; --line-soft:#EDE4DA; --hair:#EDE6D9;
    --accent:#5C6937; --cta:#F0803B;
    --sky:#CAE7FB; --sky-soft:#E3F2FD; --sky-ink:#2C5169; --tint-fill:#EEF0E4; --tint-ink:#3C481A; --chip-bg:#EFE9DE;
    --shadow-sm:0 1px 2px rgba(46,49,25,.05);
    --shadow:0 2px 4px rgba(46,49,25,.04), 0 14px 34px -18px rgba(46,49,25,.20);
    --radius:16px; --radius-sm:12px;
    --font-display:"Unbounded","Avenir Next","Segoe UI",system-ui,sans-serif;
    --font-body:"Montserrat","Avenir Next","Helvetica Neue",system-ui,sans-serif;
    --font-serif:"Noto Serif",Georgia,"Times New Roman",serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#2F3A17; --surface:#3C481A; --surface-2:#485526;
      --ink:#FDF6F0; --ink-soft:#D5DDB3; --muted:#D3C9B9; --muted-2:#B9B29E; --taupe:#D3C9B9;
      --line:#55642B; --line-soft:#4A5824; --hair:#4F5D28;
      --accent:#C9D49A; --cta:#FF8562; --coral:#FF7A6E;
      --sky:#2B4658; --sky-soft:#354F62; --sky-ink:#CAE7FB; --tint-fill:#485526; --tint-ink:#FDF6F0; --chip-bg:#4A5824;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow:0 2px 6px rgba(0,0,0,.3), 0 16px 40px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"]{
    --bg:#FDF6F0; --surface:#FFFFFF; --surface-2:#F5EEE4; --ink:#242424; --ink-soft:#5C6937;
    --muted:#655A50; --muted-2:#A8A092; --taupe:#655A50; --line:#E0D6CE; --line-soft:#EDE4DA; --hair:#EDE6D9; --accent:#5C6937; --cta:#F0803B; --coral:#F95D51;
    --sky:#CAE7FB; --sky-soft:#E3F2FD; --sky-ink:#2C5169; --tint-fill:#EEF0E4; --tint-ink:#3C481A; --chip-bg:#EFE9DE;
    --shadow-sm:0 1px 2px rgba(46,49,25,.05); --shadow:0 2px 4px rgba(46,49,25,.04), 0 14px 34px -18px rgba(46,49,25,.20);
  }
  :root[data-theme="dark"]{
    --bg:#2F3A17; --surface:#3C481A; --surface-2:#485526; --ink:#FDF6F0; --ink-soft:#D5DDB3;
    --muted:#D3C9B9; --muted-2:#B9B29E; --taupe:#D3C9B9; --line:#55642B; --line-soft:#4A5824; --hair:#4F5D28; --accent:#C9D49A; --cta:#FF8562; --coral:#FF7A6E;
    --sky:#2B4658; --sky-soft:#354F62; --sky-ink:#CAE7FB; --tint-fill:#485526; --tint-ink:#FDF6F0; --chip-bg:#4A5824;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 2px 6px rgba(0,0,0,.3), 0 16px 40px -20px rgba(0,0,0,.6);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  #ys{ font-family:var(--font-body); color:var(--ink); background:var(--bg); min-height:100vh; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  #ys *:focus-visible{ outline:2px solid var(--cta); outline-offset:3px; border-radius:8px; }
  h1,h2,h3{ font-family:var(--font-display); font-weight:500; letter-spacing:-.01em; color:var(--ink); margin:0; text-wrap:balance; }
  button{ font-family:inherit; cursor:pointer; color:inherit; }

  /* ---------- Top bar ---------- */
  .top{ position:sticky; top:0; z-index:30; background:color-mix(in srgb,var(--bg) 80%,transparent);
    backdrop-filter:blur(12px); border-bottom:1px solid var(--line-soft); }
  .top-in{ max-width:none; padding:15px 40px; display:flex; align-items:center; gap:14px; }
  .burger{ width:42px; height:42px; border:1px solid var(--line); background:var(--surface); border-radius:12px;
    display:grid; place-items:center; flex:none; transition:background .12s, border-color .12s; }
  .burger:hover{ background:var(--surface-2); }
  .burger svg{ width:19px; height:19px; }
  .brand{ display:flex; align-items:center; gap:13px; min-width:0; }
  .brand-logo{ height:22px; width:auto; display:block; flex:none; }
  .top .brand-logo{ cursor:pointer; }
  .top .brand-logo:focus-visible{ outline:2px solid var(--cta); outline-offset:4px; border-radius:4px; }
  @media (prefers-color-scheme: dark){ .brand-logo{ filter:brightness(1.55) saturate(.9); } }
  :root[data-theme="light"] .brand-logo{ filter:none; }
  :root[data-theme="dark"] .brand-logo{ filter:brightness(1.55) saturate(.9); }
  .brand-sub{ font-size:13px; color:var(--taupe); white-space:nowrap; padding-left:13px; border-left:1px solid var(--line); }
  .search{ flex:1; max-width:420px; margin-left:auto; display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:11px 15px; color:var(--muted);
    box-shadow:var(--shadow-sm); transition:border-color .12s, box-shadow .12s; }
  .search:hover{ border-color:color-mix(in srgb,var(--accent) 40%,var(--line)); }
  .search svg{ width:17px; height:17px; flex:none; }
  .search span{ flex:1; text-align:left; font-size:14px; }
  .kbd{ font-size:11px; font-weight:600; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:2px 6px; background:var(--bg); }

  /* ---------- Page ---------- */
  .page{ max-width:none; padding:24px 40px; }
  .view{ display:none; }
  .view.on{ display:block; animation:fade .22s ease; }
  @keyframes fade{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

  /* ---------- Home ---------- */
  .home{ padding-top:clamp(8px,1.5vh,16px); padding-bottom:24px; }
  .ghead{ font-family:var(--font-display); font-weight:500; font-size:clamp(22px,2.7vw,30px); letter-spacing:-.015em;
    color:var(--cta); margin:52px 0 22px; text-wrap:balance; }
  .home .ghead:first-of-type{ margin-top:8px; }
  .primary{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .big{ position:relative; text-align:left; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:28px; min-height:186px; display:flex; flex-direction:column;
    box-shadow:var(--shadow-sm); }
  .big h3{ font-size:20px; line-height:1.2; margin-bottom:16px; }
  .big p{ margin:0 0 16px; font-size:13px; color:var(--taupe); line-height:1.5; max-width:24ch; min-height:4.5em; }
  .big .go{ margin-top:auto; align-self:flex-start; display:inline-flex; align-items:center; gap:8px; background:var(--olive); color:var(--cream);
    font-size:13px; font-weight:500; padding:10px 18px; border-radius:50px; transition:background .16s ease; }
  .big .go svg{ width:15px; height:15px; transition:transform .16s ease; }
  .big:hover .go{ background:var(--olive-dark); }
  .big:hover .go svg{ transform:translateX(4px); }
  :root[data-theme="dark"] .big .go{ background:var(--cream); color:var(--olive-dark); }
  :root[data-theme="dark"] .big:hover .go{ background:#fff; }

  .groups{ display:flex; flex-direction:column; gap:32px; margin-top:48px; }
  .group .glbl{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:600; margin-bottom:15px; }
  .cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .scard{ text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:18px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:6px;
    transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease; }
  .scard:hover{ transform:translateY(-3px); box-shadow:var(--shadow); border-color:color-mix(in srgb,var(--accent) 45%,var(--line)); }
  .scard b{ font-family:var(--font-display); font-weight:500; font-size:14.5px; line-height:1.25; }
  .scard span{ font-size:12px; color:var(--muted); line-height:1.45; }

  /* ---------- Detail views ---------- */
  .back{ display:inline-flex; align-items:center; gap:7px; background:none; border:0; color:var(--muted);
    font-size:13.5px; font-weight:500; padding:6px 0; margin-bottom:18px; }
  .back:hover{ color:var(--ink); }
  .back svg{ width:16px; height:16px; }
  .head h1{ font-size:clamp(23px,3.2vw,30px); color:var(--cta); }
  .head p{ color:var(--muted); font-size:14px; margin:14px 0 0; max-width:60ch; }

  /* Tabs (promos hub) */
  .tabs{ display:inline-flex; gap:4px; margin:14px 0 4px; background:var(--surface-2); border-radius:50px; padding:4px; }
  .tabs button{ border:0; background:transparent; color:var(--muted); font-size:13.5px; font-weight:600;
    padding:8px 18px; border-radius:50px; transition:background .12s, color .12s; }
  .tabs button.on{ background:var(--olive); color:var(--cream); }
  :root[data-theme="dark"] .tabs button.on{ background:var(--cream); color:var(--olive-dark); }

  .filters{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:20px 0 18px; }
  .flbl{ font-size:12px; color:var(--muted); font-weight:600; }
  .chip{ border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:6px 13px;
    border-radius:20px; font-size:12.5px; font-weight:500; transition:background .12s, border-color .12s; }
  .chip:hover{ border-color:color-mix(in srgb,var(--accent) 45%,var(--line)); }
  .chip.on{ background:var(--olive); color:var(--cream); border-color:var(--olive); }
  :root[data-theme="dark"] .chip.on{ background:var(--accent); color:#22240F; border-color:var(--accent); }
  .lsearch{ margin-left:auto; display:flex; align-items:center; gap:8px; background:var(--surface);
    border:1px solid var(--line); border-radius:11px; padding:8px 12px; min-width:210px; }
  .lsearch svg{ width:15px; height:15px; color:var(--muted); flex:none; }
  .lsearch input{ border:0; background:none; color:var(--ink); font-family:inherit; font-size:13px; width:100%; outline:none; }

  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:13px; }
  .promo{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:18px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:9px;
    transition:box-shadow .3s ease, border-color .3s ease; }
  .promo.hl{ border-color:var(--cta); box-shadow:0 0 0 3px color-mix(in srgb,var(--cta) 45%,transparent), var(--shadow); }
  .promo-top{ display:flex; align-items:flex-start; gap:10px; }
  .promo-name{ font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:-.01em; line-height:1.2; min-height:2.4em; }
  .promo-disc{ margin-left:auto; font-family:var(--font-display); font-weight:700; font-size:14px; color:var(--cta); white-space:nowrap; }
  .promo-cond{ font-size:12.5px; color:var(--ink); opacity:.88; line-height:1.5; min-height:4.5em;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; }
  .promo-foot{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .tag{ font-size:10px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; padding:3px 8px; border-radius:20px; }
  .tag.studio{ background:var(--sky-soft); color:var(--sky-ink); }
  .tag.self{ background:color-mix(in srgb,var(--coral) 16%,transparent); color:var(--coral); }
  .tag.warn{ background:color-mix(in srgb,var(--cta) 15%,transparent); color:var(--cta); }
  .empty{ grid-column:1/-1; text-align:center; padding:48px 20px; color:var(--muted); font-size:13.5px; }
  .code-chip{ display:inline-flex; align-items:center; gap:6px; padding:5px 6px 5px 12px;
    border:1.5px dashed color-mix(in srgb,var(--accent) 55%,var(--line)); border-radius:10px; }
  .code-text{ font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:-.01em; color:var(--ink); }
  .copy-btn{ display:grid; place-items:center; width:26px; height:26px; border:0; background:transparent; border-radius:7px;
    color:var(--muted); cursor:pointer; transition:background .12s, color .12s; }
  .copy-btn:hover{ background:var(--sky-soft); color:var(--sky-ink); }
  .copy-btn.copied{ color:var(--accent); }
  .copy-btn svg{ width:15px; height:15px; }
  .toast{ position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(14px); z-index:200;
    display:flex; align-items:center; gap:8px; background:var(--olive-dark); color:var(--cream); font-size:13.5px; font-weight:600;
    padding:11px 18px; border-radius:12px; box-shadow:var(--shadow); opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; }
  .toast svg{ width:16px; height:16px; color:var(--peach); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* Scaffold */
  .scaffold{ margin-top:26px; display:flex; flex-direction:column; gap:12px; max-width:720px; }
  .block{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:22px 22px 20px; box-shadow:var(--shadow-sm); }
  .block h3{ font-size:15px; margin-bottom:18px; }
  .block ul{ margin:0; padding-left:18px; font-size:13px; line-height:1.75; }
  .block ul li::marker{ color:var(--accent); }
  .pl{ height:11px; border-radius:6px; background:var(--surface-2); margin:9px 0; }
  .pl.s{ width:66%; } .pl.m{ width:86%; }
  .note{ display:flex; gap:10px; align-items:flex-start; margin-top:4px; padding:15px; font-size:12.5px;
    color:var(--ink-soft); background:color-mix(in srgb,var(--olive) 8%,var(--surface));
    border:1px solid color-mix(in srgb,var(--olive) 26%,var(--line)); border-radius:12px; max-width:720px; }
  .note svg{ width:16px; height:16px; flex:none; margin-top:1px; }

  /* Section content */
  .block h3{ font-family:var(--font-display); font-weight:500; }
  .block.bare{ padding:0; background:none; border:0; box-shadow:none; }
  .block p{ margin:0 0 10px; font-size:13.5px; line-height:1.65; }
  .block p:last-child{ margin-bottom:0; }
  .block ul, .block ol{ margin:0; padding-left:18px; font-size:13.5px; line-height:1.7; }
  .block li{ margin:4px 0; }
  .block li::marker{ color:var(--accent); font-weight:600; }
  .block a{ color:var(--accent); font-weight:600; text-decoration:none; }
  .block a:hover{ color:var(--cta); }
  .kv{ margin:0; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:0; font-size:13.5px; }
  .kv > div{ display:contents; }
  .kv dt, .kv dd{ margin:0; padding:9px 0; border-top:1px solid var(--line-soft); line-height:1.5; }
  .kv > div:first-child dt, .kv > div:first-child dd{ border-top:0; padding-top:0; }
  .kv > div:last-child dt, .kv > div:last-child dd{ padding-bottom:0; }
  .kv dt{ color:var(--muted); padding-right:28px; }
  .kv dd{ font-weight:600; text-align:right; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
  .scaffold:has(.row2){ max-width:none; }
  @media (max-width:760px){ .row2{ grid-template-columns:1fr; } }
  .kv-note{ display:block; margin-top:9px; font-size:12.5px; font-weight:400; color:var(--muted); line-height:1.4; }
  .tbl-wrap{ overflow-x:auto; }
  .tbl{ width:100%; border-collapse:collapse; font-size:13.5px; table-layout:fixed; }
  .tbl th:first-child, .tbl td:first-child{ width:42%; }
  .tbl th{ text-align:left; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--sky-ink); background:var(--sky-soft); padding:8px 12px; }
  .tbl th:first-child{ border-radius:8px 0 0 8px; } .tbl th:last-child{ border-radius:0 8px 8px 0; }
  .tbl td:first-child{ padding-left:12px; }
  .tbl td{ padding:9px 12px 9px 0; border-bottom:1px solid var(--line-soft); vertical-align:top; }
  .tbl tr:first-child td{ padding-top:11px; }
  .tbl tr:last-child td{ border-bottom:0; padding-bottom:0; }
  .tbl td:nth-child(2), .tbl td:nth-child(3){ font-weight:400; color:var(--ink); white-space:nowrap; }
  .callout{ display:flex; gap:10px; align-items:flex-start; padding:13px 15px; font-size:13.5px; line-height:1.55; border-radius:12px; margin:0 0 10px; }
  .callout:last-child{ margin-bottom:0; }
  .callout svg{ width:17px; height:17px; flex:none; margin-top:2px; }
  .callout.info{ color:var(--sky-ink); background:var(--sky); }
  .callout.warn{ color:var(--ink); background:color-mix(in srgb,var(--cta) 12%,var(--surface)); border:1px solid color-mix(in srgb,var(--cta) 35%,var(--line)); }
  .callout.warn svg{ color:var(--cta); }
  .callout.info svg{ color:var(--sky-ink); }
  .script{ margin:0 0 8px; padding:11px 15px; border-left:3px solid var(--olive); background:var(--tint-fill); border-radius:0 10px 10px 0; font-family:var(--font-serif); font-size:14px; line-height:1.6; font-style:italic; color:var(--tint-ink); }
  .script:last-child{ margin-bottom:0; }
  .doclink{ display:inline-flex; align-items:center; gap:8px; margin-top:6px; padding:10px 18px; border:0; border-radius:50px; background:var(--olive);
    font-size:13px; font-weight:500; color:var(--cream) !important; text-decoration:none !important; transition:background .14s ease; }
  .doclink:hover{ background:var(--olive-dark); }
  .doclink svg{ width:15px; height:15px; color:var(--cream); }
  :root[data-theme="dark"] .doclink{ background:var(--cream); color:var(--olive-dark) !important; }
  :root[data-theme="dark"] .doclink svg{ color:var(--olive-dark); }
  .fig{ margin:14px 0 0; }
  .fig img{ display:block; width:100%; height:auto; border:1px solid var(--line); border-radius:10px; background:#fff; cursor:zoom-in; transition:box-shadow .14s ease; }
  .fig img:hover{ box-shadow:var(--shadow); }
  .fig figcaption{ margin-top:8px; font-size:12.5px; color:var(--muted); line-height:1.5; }
  .note.todo{ margin-top:12px; color:var(--sky-ink); background:var(--sky-soft); border-color:var(--sky); border-style:dashed; }
  .note.todo b{ color:var(--sky-ink) !important; }
  .note.todo svg{ color:var(--sky-ink) !important; }
  .note.todo b{ color:var(--ink); font-weight:600; }
  /* Phone chip: dashed frame + copy button (same pattern as promo codes) */
  .phone{ display:inline-flex; align-items:center; gap:4px; padding:3px 4px 3px 11px; margin:-3px 0;
    border:1.5px dashed color-mix(in srgb,var(--accent) 55%,var(--line)); border-radius:50px; white-space:nowrap; vertical-align:middle; }
  .phone .num{ font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink); text-decoration:none; }
  .phone a.num:hover{ color:var(--accent); }
  .phone .copy-btn{ width:24px; height:24px; border-radius:50%; }
  /* Lightbox for screenshots */
  .lb{ position:fixed; inset:0; z-index:150; background:rgba(60,72,26,.86); display:none; align-items:center; justify-content:center; padding:32px; cursor:zoom-out; }
  .lb.open{ display:flex; animation:fade .18s ease; }
  .lb img{ max-width:min(1400px,100%); max-height:100%; border-radius:10px; background:#fff; box-shadow:0 30px 80px -20px rgba(0,0,0,.6); }
  .lb-x{ position:absolute; top:18px; right:18px; width:40px; height:40px; border:1px solid rgba(253,246,240,.35); background:rgba(253,246,240,.1); color:var(--cream); border-radius:50%; display:grid; place-items:center; }
  .lb-x:hover{ background:rgba(253,246,240,.22); }
  .lb-x svg{ width:18px; height:18px; }
  .lb-cap{ position:absolute; left:50%; bottom:22px; transform:translateX(-50%); color:var(--cream); font-size:13px; max-width:80%; text-align:center; opacity:.9; }
  .note.todo svg{ color:var(--muted-2); }
  @media (max-width:560px){ .kv{ grid-template-columns:1fr; } .kv dd{ border-top:0; padding-top:0; text-align:left; } }

  /* ---------- Drawer ---------- */
  .drawer{ position:fixed; top:0; left:0; height:100vh; width:312px; max-width:86vw; z-index:70;
    background:var(--olive-dark); color:var(--cream); border-right:0; transform:translateX(-102%);
    transition:transform .22s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column; overflow-y:auto; }
  .drawer.open{ transform:none; box-shadow:var(--shadow); }
  .drawer-top{ display:flex; align-items:center; justify-content:space-between; padding:18px 18px 12px; }
  .drawer-brand{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
  .drawer-logo-img{ height:22px; width:auto; display:block; cursor:pointer; }
  .drawer-logo-img:focus-visible{ outline:2px solid var(--cta); outline-offset:4px; border-radius:4px; }
  .drawer-brand small{ font-size:11px; color:var(--cream); opacity:.7; }
  .drawer .brand-logo{ filter:brightness(0) invert(1) !important; opacity:.95; }
  .x{ width:34px; height:34px; border:1px solid rgba(253,246,240,.25); background:transparent; color:var(--cream); border-radius:10px; display:grid; place-items:center; }
  .x:hover{ background:rgba(253,246,240,.1); }
  .x svg{ width:16px; height:16px; }
  .drawer-nav{ padding:6px 12px 12px; }
  .dgroup{ font-family:var(--font-display); font-size:12px; font-weight:400; letter-spacing:.02em; color:var(--cream); opacity:.62; padding:30px 10px 10px; }
  .dgroup:first-of-type{ padding-top:14px; }
  .ditem{ display:block; width:100%; text-align:left; border:0; background:transparent; color:var(--cream);
    padding:9px 11px; border-radius:10px; font-size:13.5px; font-weight:500; transition:background .12s; }
  .ditem:hover{ background:rgba(253,246,240,.1); }
  .drawer-foot{ margin-top:auto; padding:12px 16px 18px; }
  .theme{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%; padding:10px;
    border:1px solid rgba(253,246,240,.25); background:transparent; color:var(--cream); border-radius:50px; font-size:12.5px; font-weight:500; }
  .theme:hover{ background:rgba(253,246,240,.1); }
  .theme svg{ width:15px; height:15px; }
  .backdrop{ position:fixed; inset:0; background:rgba(60,72,26,.45); z-index:65; opacity:0; pointer-events:none; transition:opacity .2s; }
  .backdrop.open{ opacity:1; pointer-events:auto; }

  /* ---------- Command palette ---------- */
  .cmd-ov{ position:fixed; inset:0; z-index:100; background:rgba(60,72,26,.45); backdrop-filter:blur(3px);
    display:none; align-items:flex-start; justify-content:center; padding:90px 20px; }
  .cmd-ov.open{ display:flex; }
  .cmd{ width:100%; max-width:560px; background:var(--surface); border:1px solid var(--line); border-radius:17px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.4); overflow:hidden; animation:pop .16s ease; }
  @keyframes pop{ from{ transform:translateY(-8px) scale(.99); opacity:0; } to{ transform:none; opacity:1; } }
  .cmd-in{ display:flex; align-items:center; gap:11px; padding:15px 17px; border-bottom:1px solid var(--line-soft); }
  .cmd-in svg{ width:18px; height:18px; color:var(--muted); }
  .cmd-in input{ flex:1; border:0; background:none; color:var(--ink); font-family:inherit; font-size:15px; outline:none; }
  .cmd-list{ max-height:340px; overflow-y:auto; padding:7px; }
  .cmd-cat{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; padding:10px 11px 5px; }
  .cmd-item{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; border:0; background:none;
    padding:9px 11px; border-radius:10px; color:var(--ink); font-size:13.5px; }
  .cmd-item:hover, .cmd-item.sel{ background:var(--surface-2); }
  .cmd-item small{ color:var(--muted); font-size:11.5px; margin-left:auto; }
  .cmd-empty{ padding:26px; text-align:center; color:var(--muted); font-size:13px; }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  @media (max-width:1080px){ .primary{ grid-template-columns:repeat(2,1fr); } .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:920px){ .brand-sub{ display:none; } }
  @media (max-width:760px){
    .primary{ grid-template-columns:1fr; }
    .cards{ grid-template-columns:1fr; }
    .top-in,.page{ padding-left:20px !important; padding-right:20px !important; }
    .grid{ grid-template-columns:1fr; }
    .brand{ display:none; }
    .search{ max-width:none; }
    .search span{ display:none; }
    .lsearch{ margin-left:0; width:100%; }
    .filters{ gap:8px; }
  }
</style>

    t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    t=t.replace(/([\w.+-]+@[\w-]+\.[\w.]+)/g,function(em){
      return '<span class="phone"><a class="num" href="mailto:'+em+'">'+em+'</a><button class="copy-btn" type="button" data-copy="'+em+'" data-msg="Почта скопирована" aria-label="Скопировать почту" title="Скопировать">'+copyIcon+'</button></span>';
    });
    t=t.replace(/(?:\+7|8)[\s\u00a0]?\(\d{3}\)[\s\u00a0]?\d{3}-\d{2}-\d{2}/g,function(ph){
      var digits='+7'+ph.replace(/\D/g,'').slice(1);
      return '<span class="phone"><span class="num">'+ph+'</span><button class="copy-btn" type="button" data-copy="'+digits+'" data-msg="Номер скопирован" aria-label="Скопировать номер" title="Скопировать">'+copyIcon+'</button></span>';
    });
    t=t.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
    return t;
  }

      {h:'Папки на Яндекс.Диске',body:[{t:'link',href:YADISK,label:'Возвраты — заявления и чеки'}]}
    ],
    'sz-receipts':[
      {h:'Когда отправлять чек',body:[
        {t:'callout',kind:'warn',v:'Чек после выплаты самозанятому — **строго в течение 2 дней** после получения выплаты.'}
      ]},
      {h:'К кому обращаться',body:[{t:'kv',v:[['Вихрова Евгения — бухгалтер','+7 (925) 072-17-20']]}]}
    ],
    fns:[
      {h:'1. Сохраняйте спокойствие',body:[{t:'ul',v:['Будьте вежливы и спокойны.','Не спорьте и не препятствуйте проверке.','Отвечайте только на вопросы, касающиеся вашей работы.']}]},
      {h:'2. Сразу сообщите руководству',body:[{t:'kv',v:[MGMT[0],MGMT[1]]}]},
      {h:'3. Если проводится контрольная закупка',body:[{t:'ul',v:['Проведите продажу в обычном порядке.','Обязательно пробейте и выдайте чек.','Не отменяйте продажу после того, как узнали о проверке.']}]},
      {h:'4. Если задают вопросы',body:[
        {t:'quote',v:'Я администратор студии.'},
        {t:'quote',v:'Я не уполномочен представлять интересы организации. По вопросам деятельности студии, пожалуйста, обратитесь к руководителю.'},
        {t:'quote',v:'Я уже сообщил руководству о вашем визите.'}
      ]},
      {h:'5. Если просят документы',body:[
        {t:'p',v:'Предоставляйте только документы, относящиеся к вашим обязанностям.'},
        {t:'quote',v:'Эти вопросы находятся в компетенции руководства. Я передал информацию ответственным лицам.'}
      ]},
      {h:'6. Не подписывайте документы без согласования',body:[{t:'p',v:'Если вас просят подписать документы, сначала свяжитесь с руководителем.'}]},
      {h:'Контакты',body:[{t:'kv',v:MGMT}]},
      {h:'',body:[{t:'callout',kind:'info',v:'**Главное правило:** сохраняйте спокойствие, выполняйте свои обязанности и сразу информируйте руководство. Не берите на себя функции представителя компании и не отвечайте на вопросы, выходящие за рамки вашей должности.'}]}
    ]
  };
  /* Чего не хватает в памятке — показывается внизу раздела, чтобы было видно, что ещё собрать */
  var TODO={
    rules:'Текст правила про опоздания на класс.',
    fitmost:'Памятка по Fitmost из чатов — найти и добавить.',
    teachers:'Актуальный список преподавателей, работающих с беременными (новый опрос — сентябрь 2026).',
    'price-grp':'Прайс на частные группы для клиента — найти на Яндекс.Диске.',
    'price-ind':'Актуальная акция «пакет персоналок» — сверить с прайсом.',
    mats:'Фотографии раскладки ковров и порядка в зале — найти в чатах.',
    rent:'Условия и порядок аренды залов.',
    contracts:'Инструкция по подготовке договоров.',
    receipts:'Где и как искать чеки по продажам.',
    'sz-receipts':'Контакт Катерины и скриншоты из приложения с шагами оформления чека.',
    docs:'Ссылки на шаблоны заявлений и бланки.'
  };

  /* ---------- Elements ---------- */
  var page=document.getElementById('page');

  /* ---------- Router ---------- */
  function go(id,opts){
    if(id==='home'){ renderHome(); }
    else{
      var s=sec(id);
      if(!s){ renderHome(); }
      else if(s.kind==='promos') renderPromos((opts&&opts.tab)||'promos',opts&&opts.key);
      else renderContent(s);
    }
    closeDrawer();
    if(!(opts&&opts.key)) window.scrollTo(0,0);
  }
  function bind(root){ root.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ go(b.getAttribute('data-go')); }); }); }
  function backBtn(){ return '<button class="back" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Назад</button>'; }

  /* ---------- Copy code + toast ---------- */
  var toastEl=document.getElementById('toast');
  function toast(msg){
    toastEl.innerHTML=checkIcon+'<span>'+esc(msg)+'</span>';
    toastEl.classList.add('show');
    clearTimeout(toastEl._t); toastEl._t=setTimeout(function(){ toastEl.classList.remove('show'); },1900);
  }
  function fallbackCopy(text){
    try{ var ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }catch(e){}
  }
  function copyCode(code,btn,msg){
    var ok=function(){ if(btn){ btn.classList.add('copied'); setTimeout(function(){ btn.classList.remove('copied'); },1400); } toast(msg||'Промокод скопирован'); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(ok,function(){ fallbackCopy(code); ok(); }); }
    else { fallbackCopy(code); ok(); }
  }

  page.addEventListener('click',function(e){
    var b=e.target.closest('[data-copy]');
    if(b){ copyCode(b.getAttribute('data-copy'),b,b.getAttribute('data-msg')); return; }
    var im=e.target.closest('.fig img');
    if(im){ openLb(im); }
  });

  /* ---------- Lightbox ---------- */
  var lb=document.getElementById('lb'), lbImg=document.getElementById('lbImg'), lbCap=document.getElementById('lbCap');
  function openLb(im){ lbImg.src=im.src; lbImg.alt=im.alt||''; var f=im.closest('figure'), c=f&&f.querySelector('figcaption'); lbCap.textContent=c?c.textContent:''; lb.classList.add('open'); }
  function closeLb(){ lb.classList.remove('open'); lbImg.removeAttribute('src'); }
  lb.addEventListener('click',closeLb);
  document.getElementById('lbClose').addEventListener('click',function(e){ e.stopPropagation(); closeLb(); });

  /* ---------- Home ---------- */
  function renderHome(){
    var groups={}, order=[];
    SECTIONS.forEach(function(s){ if(!groups[s.group]){ groups[s.group]=[]; order.push(s.group); } groups[s.group].push(s); });
    var h='<section class="view on home">';
    order.forEach(function(g){
      h+='<h2 class="ghead">'+esc(g)+'</h2><div class="primary">';
      groups[g].forEach(function(s){
        h+='<button class="big" data-go="'+s.id+'"><h3>'+nb(esc(s.title))+'</h3><p>'+nb(esc(dedot(s.desc)))+'</p>'
          +'<span class="go">Открыть '+arrow+'</span></button>';
      });
      h+='</div>';
    });
    h+='</section>';
    page.innerHTML=h;
    bind(page);
  }

  /* ---------- Promos hub (tabbed, dedup акции+промокоды) ---------- */
  function renderPromos(tab,focusKey){
    var studio='all', query='';
    var h='<section class="view on">'+backBtn();
    h+='<div class="head"><h1>Акции и промокоды</h1><p>Акции выбираются во вкладке «Маркетинговая акция» при создании продажи. Промокоды с пометкой «на сайте» гость может ввести сам.</p></div>';
    h+='<div class="tabs"><button data-tab="promos">Акции</button><button data-tab="codes">Промокоды</button></div>';
    h+='<div class="filters" id="filters"><span class="flbl">Студия:</span>'
      +'<button class="chip on" data-studio="all">Все</button>';
    STUDIOS.forEach(function(st){ h+='<button class="chip" data-studio="'+st.code+'" title="'+esc(st.name)+'">'+st.code+' · '+esc(st.name)+'</button>'; });
    h+='<label class="lsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="ls" placeholder="Название или условие…" autocomplete="off"></label>';
    h+='</div><div class="grid" id="grid"></div></section>';
    page.innerHTML=h; bind(page);

    var grid=document.getElementById('grid');
    var tabBtns=page.querySelectorAll('[data-tab]');
    function draw(){
      var data=tab==='promos'?PROMOS:CODES, q=query.toLowerCase();
      var rows=data.filter(function(p){
        var okS=studio==='all'||p.studios.indexOf(studio)!==-1;
        var okQ=!q||(p.name+' '+p.cond).toLowerCase().indexOf(q)!==-1;
        return okS&&okQ;
      });
      if(!rows.length){ grid.innerHTML='<div class="empty">Ничего не найдено. Сбросьте фильтр или измените запрос.</div>'; return; }
      grid.innerHTML=rows.map(function(p){
        var tags='';
        if(tab==='codes'&&p.self) tags+='<span class="tag self">на сайте</span>';
        if(p.warn) tags+='<span class="tag warn">по согласованию</span>';
        tags+=p.studios.split(',').map(function(c){ return '<span class="tag studio" title="'+esc(studioName(c))+'">'+c+'</span>'; }).join('');
        var head = tab==='codes'
          ? '<span class="code-chip"><span class="code-text">'+esc(p.name)+'</span>'
            +'<button class="copy-btn" type="button" data-copy="'+esc(p.name)+'" aria-label="Скопировать промокод" title="Скопировать">'+copyIcon+'</button></span>'
          : '<span class="promo-name">'+esc(p.name)+'</span>';
        return '<article class="promo" data-key="'+esc(p.name)+'"><div class="promo-top">'+head+'<span class="promo-disc">'+esc(p.disc)+'</span></div>'
          +'<div class="promo-cond" title="'+esc(dedot(p.cond))+'">'+esc(dedot(p.cond))+'</div><div class="promo-foot">'+tags+'</div></article>';
      }).join('');
    }
    function setTab(t){ tab=t; tabBtns.forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-tab')===t); }); draw(); }
    tabBtns.forEach(function(b){ b.addEventListener('click',function(){ setTab(b.getAttribute('data-tab')); }); });
    page.querySelectorAll('#filters [data-studio]').forEach(function(b){
      b.addEventListener('click',function(){
        studio=b.getAttribute('data-studio');
        page.querySelectorAll('#filters [data-studio]').forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on'); draw();
      });
    });
    var ls=document.getElementById('ls'); ls.addEventListener('input',function(){ query=ls.value; draw(); });
    setTab(tab||'promos');

    if(focusKey){
      var target=null, arts=grid.querySelectorAll('.promo');
      for(var i=0;i<arts.length;i++){ if(arts[i].getAttribute('data-key')===focusKey){ target=arts[i]; break; } }
      if(target){
        target.classList.add('hl');
        setTimeout(function(){ target.scrollIntoView({block:'center',behavior:'smooth'}); },40);
        setTimeout(function(){ target.classList.remove('hl'); },2600);
      }
    }
  }

  /* ---------- Section content ---------- */
  var infoIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>';
  var warnIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18h.01"/></svg>';
  var linkIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';
  function node(n){
    switch(n.t){
      case 'p':       return '<p>'+md(n.v)+'</p>';
      case 'ul':      return '<ul>'+n.v.map(function(i){ return '<li>'+md(i)+'</li>'; }).join('')+'</ul>';
      case 'ol':      return '<ol>'+n.v.map(function(i){ return '<li>'+md(i)+'</li>'; }).join('')+'</ol>';
      case 'kv':      return '<dl class="kv">'+n.v.map(function(r){ return '<div><dt>'+md(r[0])+'</dt><dd>'+md(r[1])+(r[2]?'<small class="kv-note">'+md(r[2])+'</small>':'')+'</dd></div>'; }).join('')+'</dl>';
      case 'table':   return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+n.head.map(function(h){ return '<th>'+md(h)+'</th>'; }).join('')+'</tr></thead><tbody>'
                        +n.rows.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+md(c)+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table></div>';
      case 'callout': return '<div class="callout '+(n.kind||'info')+'">'+(n.kind==='warn'?warnIcon:infoIcon)+'<span>'+md(n.v)+'</span></div>';
      case 'quote':   return '<blockquote class="script">«'+md(n.v)+'»</blockquote>';
      case 'link':    return '<a class="doclink" href="'+esc(n.href)+'" target="_blank" rel="noopener">'+linkIcon+'<span>'+md(n.label)+'</span></a>';
      case 'img':     return '<figure class="fig"><img src="'+esc((window.YS_IMG||{})[n.src]||n.src)+'" alt="'+esc(n.alt||'')+'" loading="lazy">'+(n.cap?'<figcaption>'+md(n.cap)+'</figcaption>':'')+'</figure>';
    }
    return '';
  }
  function renderContent(s){
    var h='<section class="view on">'+backBtn();
    h+='<div class="head"><h1>'+esc(s.title)+'</h1><p>'+md(dedot(s.desc))+'</p></div><div class="scaffold">';
    var blocks=CONTENT[s.id];
    if(blocks&&blocks.length){
      /* consecutive blocks with half:true sit side by side */
      var inRow=false;
      blocks.forEach(function(b,i){
        if(b.half&&!inRow){ h+='<div class="row2">'; inRow=true; }
        h+='<div class="block'+(b.h?'':' bare')+'">'+(b.h?'<h3>'+md(b.h)+'</h3>':'')+b.body.map(node).join('')+'</div>';
        if(inRow&&!(blocks[i+1]&&blocks[i+1].half)){ h+='</div>'; inRow=false; }
      });
    } else {
      h+='<div class="block"><h3>Содержание раздела</h3><div class="pl m"></div><div class="pl"></div><div class="pl s"></div></div>';
    }
    h+='</div>';
    if(TODO[s.id]) h+='<div class="note todo">'+infoIcon+'<span><b>Ожидает материалов:</b> '+md(TODO[s.id])+'</span></div>';
    h+='</section>';
    page.innerHTML=h; bind(page);
  }

  /* ---------- Drawer (hamburger menu) ---------- */
  var drawer=document.getElementById('drawer'), backdrop=document.getElementById('backdrop'), drawerNav=document.getElementById('drawerNav');
  function buildDrawer(){
    var groups={}, order=[];
    SECTIONS.forEach(function(s){ if(!groups[s.group]){ groups[s.group]=[]; order.push(s.group); } groups[s.group].push(s); });
    var h='';
    order.forEach(function(g){ h+='<div class="dgroup">'+esc(g)+'</div>'; groups[g].forEach(function(s){ h+='<button class="ditem" data-go="'+s.id+'">'+esc(s.title)+'</button>'; }); });
    drawerNav.innerHTML=h;
    drawerNav.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ go(b.getAttribute('data-go')); }); });
  }
  function openDrawer(){ drawer.classList.add('open'); backdrop.classList.add('open'); }
  function closeDrawer(){ drawer.classList.remove('open'); backdrop.classList.remove('open'); }
  document.getElementById('burger').addEventListener('click',openDrawer);
  document.getElementById('drawerClose').addEventListener('click',closeDrawer);
  backdrop.addEventListener('click',closeDrawer);

  /* ---------- Command palette ---------- */
  var cmd=document.getElementById('cmd'), cmdInput=document.getElementById('cmdInput'), cmdList=document.getElementById('cmdList'), cmdSel=0, cmdRes=[];
  function buildIndex(){
    var idx=[{type:'Разделы',label:'Рабочий стол',nav:'home',sub:'',hay:'рабочий стол главная'}];
    function textOf(n){ if(!n) return ''; if(typeof n==='string') return n; if(Array.isArray(n)) return n.map(textOf).join(' '); return textOf(n.v)+' '+textOf(n.head)+' '+textOf(n.rows)+' '+textOf(n.label)+' '+textOf(n.cap); }
    SECTIONS.forEach(function(s){
      var body=(CONTENT[s.id]||[]).map(function(b){ return b.h+' '+textOf(b.body); }).join(' ');
      idx.push({type:'Разделы',label:s.title,nav:s.id,sub:s.group,hay:(s.title+' '+s.desc+' '+s.group+' '+body).toLowerCase()});
    });
    PROMOS.forEach(function(p){ idx.push({type:'Акции',label:p.name,nav:'promos',sub:p.disc,tab:'promos',key:p.name,hay:(p.name+' '+p.disc+' '+p.cond).toLowerCase()}); });
    CODES.forEach(function(c){ idx.push({type:'Промокоды',label:c.name,nav:'promos',sub:c.disc,tab:'codes',key:c.name,hay:(c.name+' '+c.disc+' '+c.cond).toLowerCase()}); });
    return idx;
  }
  var INDEX=buildIndex();
  function openCmd(){ cmd.classList.add('open'); cmdInput.value=''; drawCmd(''); cmdInput.focus(); }
  function closeCmd(){ cmd.classList.remove('open'); }
  function drawCmd(q){
    q=q.trim().toLowerCase();
    var res=INDEX.filter(function(r){ return !q||(r.hay||'').indexOf(q)!==-1; });
    cmdSel=0;
    if(!res.length){ cmdList.innerHTML='<div class="cmd-empty">Ничего не найдено по «'+esc(q)+'»</div>'; cmdRes=[]; return; }
    var cats={}, order=[];
    res.forEach(function(r){ if(!cats[r.type]){ cats[r.type]=[]; order.push(r.type); } cats[r.type].push(r); });
    cmdList.innerHTML=''; cmdRes=[];
    order.forEach(function(cat){
      var c=document.createElement('div'); c.className='cmd-cat'; c.textContent=cat; cmdList.appendChild(c);
      cats[cat].forEach(function(r){
        var b=document.createElement('button'); b.className='cmd-item';
        b.innerHTML='<span>'+esc(r.label)+'</span>'+(r.sub?'<small>'+esc(r.sub)+'</small>':'');
        b.addEventListener('click',function(){ selectEntry(r); });
        cmdList.appendChild(b);
        cmdRes.push({entry:r,el:b});
      });
    });
    hi();
  }
  function selectEntry(r){ closeCmd(); if(r.tab){ go('promos',{tab:r.tab,key:r.key}); } else { go(r.nav); } }
  function hi(){ cmdRes.forEach(function(r,i){ r.el.classList.toggle('sel',i===cmdSel); }); if(cmdRes[cmdSel]) cmdRes[cmdSel].el.scrollIntoView({block:'nearest'}); }
  cmdInput.addEventListener('input',function(){ drawCmd(cmdInput.value); });
  cmdInput.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){ e.preventDefault(); cmdSel=Math.min(cmdSel+1,cmdRes.length-1); hi(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); cmdSel=Math.max(cmdSel-1,0); hi(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(cmdRes[cmdSel]){ selectEntry(cmdRes[cmdSel].entry); } }
  });
  cmd.addEventListener('click',function(e){ if(e.target===cmd) closeCmd(); });
  document.getElementById('searchBtn').addEventListener('click',openCmd);

  /* Header logo → back to home */
  var homeLogo=document.querySelector('.top .brand-logo');
  if(homeLogo){
    homeLogo.setAttribute('role','button');
    homeLogo.setAttribute('tabindex','0');
    homeLogo.setAttribute('aria-label','На главную');
    homeLogo.addEventListener('click',function(){ go('home'); });
    homeLogo.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go('home'); } });
  }
  var drawerLogo=document.querySelector('.drawer-logo-img');
  if(drawerLogo){
    drawerLogo.setAttribute('role','button');
    drawerLogo.setAttribute('tabindex','0');
    drawerLogo.setAttribute('aria-label','На главную');
    drawerLogo.addEventListener('click',function(){ go('home'); });
    drawerLogo.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go('home'); } });
  }
  document.addEventListener('keydown',function(e){
    if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){ e.preventDefault(); cmd.classList.contains('open')?closeCmd():openCmd(); }
    else if(e.key==='Escape'){ closeCmd(); closeDrawer(); closeLb(); }
    else if(e.key==='/'&&!/input|textarea/i.test((document.activeElement||{}).tagName||'')){ e.preventDefault(); openCmd(); }
  });

  /* ---------- Theme ---------- */
  var themeBtn=document.getElementById('theme'), themeLbl=document.getElementById('themeLbl');
  function isDark(){ var a=document.documentElement.getAttribute('data-theme'); if(a) return a==='dark'; return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function syncTheme(){ themeLbl.textContent=isDark()?'Светлая тема':'Тёмная тема'; }
  themeBtn.addEventListener('click',function(){ document.documentElement.setAttribute('data-theme',isDark()?'light':'dark'); syncTheme(); });
  syncTheme();

  /* ---------- Init ---------- */
  buildDrawer();
  renderHome();
})();
</script>
